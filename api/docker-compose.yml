services:
  api:
    build: .
    # No published port: only Caddy (HTTPS) reaches the API.
    expose: ["8000"]
    restart: unless-stopped
    environment:
      THRESHOLD: ${THRESHOLD:-}  # empty = use metrics.json threshold
      TREE_FORMAT: ${TREE_FORMAT:-}  # empty = auto (NNPA); compress_trees = CPU
      MODEL_VERSION: ${MODEL_VERSION:-dev}
      GRANITE_URL: http://granite:8080
    volumes:
      - ./model:/app/model:ro
      - ./keys:/app/keys  # SQLite key store (hashes only); not in git, not in the image
      - ${DATA_DIR:-/home/linux1/data/training}:/data:ro

  # HTTPS (Let's Encrypt) in front of the API; http:// redirects to https://.
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-148-100-78-203.sslip.io}
    volumes:
      - ./caddy:/etc/caddy:ro  # whole dir: a single-file mount keeps the old file after rsync
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  # Granite LLM for SBAR handover notes. No published port: only the API can reach it.
  granite:
    build: ./granite
    restart: unless-stopped
    environment:
      # 350M: ~15 s per note. granite-4.0-h-micro-Q4_K_M-be.gguf (3B) writes better notes but takes ~2 min on 3 cores.
      GRANITE_MODEL: /models/${GRANITE_FILE:-granite-4.0-h-350m-bf16-be.gguf}
    volumes:
      - ${GRANITE_DIR:-/home/linux1/granite}:/models:ro

volumes:
  caddy_data:    # certificates; keep it so restarts don't hit Let's Encrypt rate limits
  caddy_config:
